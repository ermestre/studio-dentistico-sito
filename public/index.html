<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>International Dental Clinic - Tirana</title>
<meta name="description" content="Implantologia, protesi e riabilitazioni complete a Tirana, con staff che parla italiano.">
<style>
:root{--petrolio:#0f5e7a;--teal:#5fb3c4;--ink:#1d2530;--muted:#5d6878;--bg:#f7f9fb;--line:#e3e9ef}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:600;letter-spacing:.2px;margin:0}
a{color:var(--petrolio)}
header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line)}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink)}
.brand img{width:44px;height:44px;border-radius:50%;background:#fff}
.brand strong{font-family:Georgia,serif;font-size:17px}
nav a{color:var(--ink);text-decoration:none;margin-left:16px;font-size:14px}
nav a:hover{color:var(--petrolio)}
.lang{display:flex;gap:4px;margin-left:16px}
.lang button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 9px;cursor:pointer;font-size:13px}
.lang button.on{background:var(--petrolio);color:#fff;border-color:var(--petrolio)}
.hero{background:linear-gradient(135deg,#0f5e7a 0%,#2a8aa6 100%);color:#fff;padding:72px 0 64px}
.hero .wrap{display:grid;grid-template-columns:1.2fr 1fr;gap:40px;align-items:center}
.kicker{text-transform:uppercase;letter-spacing:2px;font-size:12px;opacity:.85}
.hero h1{font-size:44px;line-height:1.15;margin:10px 0 16px}
.hero p{font-size:17px;opacity:.95;margin:0 0 24px;max-width:520px}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-block;padding:12px 18px;border-radius:8px;text-decoration:none;font-weight:600;font-size:15px}
.btn-wa{background:#25d366;color:#fff}
.btn-ghost{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.5)}
.logo-card{background:#fff;border-radius:20px;padding:28px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.logo-card img{width:min(260px,70%);height:auto}
section{padding:64px 0}
section h2{font-size:30px;margin-bottom:8px}
.sub{color:var(--muted);margin:0 0 28px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px}
.card h3{font-size:19px;margin-bottom:8px;color:var(--petrolio)}
.card p{margin:0;color:var(--muted);font-size:15px}
.videos{background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.vid{display:flex;flex-direction:column;justify-content:space-between;min-height:150px;text-decoration:none;color:var(--ink)}
.vid span{font-family:Georgia,serif;font-size:18px}
.vid em{font-style:normal;color:var(--petrolio);font-size:14px;margin-top:12px}
.vid:hover{border-color:var(--teal);box-shadow:0 6px 18px rgba(15,94,122,.12)}
.more{margin-top:24px}
.more a{color:var(--petrolio);font-weight:600}
.steps{counter-reset:step;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.step{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;position:relative}
.step::before{counter-increment:step;content:counter(step);display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:var(--petrolio);color:#fff;font-weight:700;margin-bottom:12px}
.step h3{font-size:18px;margin-bottom:8px;color:var(--ink)}
.step p{margin:0;color:var(--muted);font-size:15px}
.cta{background:linear-gradient(135deg,#0f5e7a,#2a8aa6);color:#fff;border-radius:16px;padding:36px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.cta h2{color:#fff;font-size:26px;margin-bottom:6px}
.cta p{margin:0;opacity:.95;max-width:560px}
.faq details{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 20px;margin-bottom:12px}
.faq summary{cursor:pointer;font-family:Georgia,serif;font-size:17px;color:var(--ink)}
.faq details p{margin:12px 0 0;color:var(--muted)}
.todo{font-size:13px;color:#a06a00;background:#fff7e0;border-radius:6px;padding:2px 6px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start}
.info p{margin:0 0 14px}
.qr{background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px;text-align:center}
.qr img{width:200px;height:200px;margin:12px auto 0;display:block}
footer{background:var(--ink);color:#c9d3dd;padding:28px 0;font-size:14px}
footer a{color:#fff}
@media (max-width:820px){
  .hero .wrap,.split{grid-template-columns:1fr}
  .hero h1{font-size:34px}
  nav{display:none}
}
</style>
</head>

<section id="dove">

let lang = 'it';
function setLang(l){
  lang = l;
  document.documentElement.lang = l === 'sq' ? 'sq' : 'it';
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = T[l][el.dataset.i18n]);
  document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('on', b.dataset.lang === l));
